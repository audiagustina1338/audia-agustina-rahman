<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galeri | Audia Agustina Rahman</title>
<style>
:root{--bg:rgb(10,10,25);--card:rgba(255,255,255,.07);--text:rgb(240,242,255);--muted:rgb(170,175,205);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",Arial,sans-serif;color:var(--text);line-height:1.6;background:var(--bg);min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;

@keyframes geser{to{background-position:100% 100%}}
.logo,h1{background:linear-gradient(90deg,rgb(255,40,80),rgb(40,255,130),rgb(50,120,255),rgb(255,40,80));
background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:pelangi 6s linear infinite}
@keyframes pelangi{to{background-position:300% 0}}
header{background:rgba(10,10,25,.75);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);position:sticky;top:0;z-index:10;
border-bottom:2px solid transparent;border-image:linear-gradient(90deg,rgb(255,40,80),rgb(40,255,130),rgb(50,120,255)) 1}
nav{max-width:1000px;margin:auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:12px 20px}
.logo{font-weight:800;font-size:1.3rem;letter-spacing:1px}
nav ul{list-style:none;display:flex;flex-wrap:wrap;gap:6px}
nav a{color:var(--text);text-decoration:none;padding:7px 14px;border-radius:999px;font-size:.92rem;transition:all .25s}
nav a:hover{background:rgba(255,255,255,.12);box-shadow:0 0 12px rgba(50,120,255,.8);transform:translateY(-2px)}
nav a.active{background:linear-gradient(90deg,rgb(255,40,80),rgb(50,120,255));color:#fff;box-shadow:0 0 14px rgba(255,40,80,.7)}
main{max-width:1000px;margin:auto;padding:40px 20px;min-height:70vh}
h1{font-size:2.2rem;margin-bottom:16px;font-weight:800}
p{color:var(--muted);margin-bottom:12px}
code{background:rgba(255,255,255,.1);padding:2px 6px;border-radius:6px;color:rgb(255,220,120)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;margin-top:20px}
.foto{height:180px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;transition:all .3s}
.foto:nth-child(3n+1){background:linear-gradient(135deg,rgb(255,40,80),rgb(255,140,60))}
.foto:nth-child(3n+2){background:linear-gradient(135deg,rgb(40,255,130),rgb(30,180,200))}
.foto:nth-child(3n+3){background:linear-gradient(135deg,rgb(50,120,255),rgb(170,60,255))}
.grid img{width:100%;height:180px;object-fit:cover;border-radius:16px;transition:all .3s}
.foto:hover,.grid img:hover{transform:scale(1.06) rotate(-1deg);box-shadow:0 0 22px rgba(50,120,255,.9)}
