
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galeri Video | Audia Agustina Rahman</title>

<style>
:root {
    --bg: rgb(10,10,25);
    --text: rgb(240,242,255);
    --muted: rgb(170,175,205);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;
    color: var(--text);
    line-height: 1.6;
    background: var(--bg);
    min-height: 100vh;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
        radial-gradient(circle at 15% 20%, rgba(255,40,80,.35), transparent 40%),
        radial-gradient(circle at 85% 30%, rgba(40,255,130,.30), transparent 40%),
        radial-gradient(circle at 50% 90%, rgba(50,120,255,.38), transparent 45%);
    background-size: 200% 200%;
    animation: geser 14s ease-in-out infinite alternate;
}

@keyframes geser {
    to { background-position: 100% 100%; }
}

.logo, h1 {
    background: linear-gradient(90deg,
        rgb(255,40,80),
        rgb(40,255,130),
        rgb(50,120,255),
        rgb(255,40,80));
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: pelangi 6s linear infinite;
}

@keyframes pelangi {
    to { background-position: 300% 0; }
}

/* NAVBAR */
header {
    background: rgba(10,10,25,.85);
    backdrop-filter: blur(12px);
    position: sticky;
    top: 0;
    z-index: 10;
    border-bottom: 2px solid transparent;
    border-image: linear-gradient(90deg,
        rgb(255,40,80),
        rgb(40,255,130),
        rgb(50,120,255)) 1;
}

nav {
    max-width: 1000px;
    margin: auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
}

.logo {
    font-weight: 800;
    font-size: 1.3rem;
    letter-spacing: 1px;
}

nav ul {
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}

nav a {
    color: var(--text);
    text-decoration: none;
    padding: 7px 14px;
    border-radius: 999px;
    font-size: .92rem;
    transition: .25s;
}

nav a:hover {
    background: rgba(255,255,255,.12);
    box-shadow: 0 0 12px rgba(50,120,255,.8);
}

nav a.active {
    background: linear-gradient(90deg,
        rgb(255,40,80),
        rgb(50,120,255));
    color: white;
}

/* KONTEN */
main {
    max-width: 1000px;
    margin: auto;
    padding: 45px 20px;
    min-height: 75vh;
}

h1 {
    font-size: 2.2rem;
    margin-bottom: 8px;
    font-weight: 800;
}

.sub {
    color: var(--muted);
    margin-bottom: 30px;
}

/* VIDEO */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 25px;
}

figure {
    padding: 6px;
    border-radius: 18px;
    background: linear-gradient(135deg,
        rgb(255,40,80),
        rgb(40,255,130),
        rgb(50,120,255));
    transition: .3s;
}

figure:hover {
    transform: translateY(-6px);
    box-shadow: 0 0 25px rgba(50,120,255,.4);
}

video {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: contain;
    background: black;
    border-radius: 14px;
}

figcaption {
    padding: 12px 8px;
    text-align: center;
    font-weight: 600;
    color: white;
}

/* FOOTER */
footer {
    text-align: center;
    padding: 22px;
    color: var(--muted);
    background: rgba(10,10,25,.85);
    border-top: 2px solid transparent;
    border-image: linear-gradient(90deg,
        rgb(50,120,255),
        rgb(40,255,130),
        rgb(255,40,80)) 1;
}

/* RESPONSIVE */
@media(max-width:600px) {
    nav, nav ul {
        justify-content: center;
    }

    nav ul {
        margin-top: 10px;
    }

    h1 {
        font-size: 1.8rem;
    }
}
</style>
</head>

<body>

<header>
<nav>
    <div class="logo">Audia</div>

    <ul>
        <li><a href="index.html">Beranda</a></li>
        <li><a href="biodata.html">Biodata</a></li>
        <li><a href="galeri.html">Galeri</a></li>
        <li><a href="video.html" class="active">Video</a></li>
        <li><a href="tugas1.html">Tugas 1</a></li>
        <li><a href="tugas2.html">Tugas 2</a></li>
        <li><a href="tugas3.html">Tugas 3</a></li>
        <li><a href="tugas-akhir.html">Tugas Akhir</a></li>
    </ul>
</nav>
</header>

<main>

    <h1>Galeri Video</h1>
    <p class="sub">
        Kumpulan video dan dokumentasi Audia Agustina Rahman.
    </p>

    <div class="grid">

        <figure>
            <video controls preload="metadata">
                <source src="video.Mp4" type="video/mp4">
                Browser kamu tidak mendukung pemutaran video.
            </video>
            <figcaption>Video Vlog</figcaption>
        </figure>

    </div>

</main>

<footer>
    © 2026 Audia Agustina Rahman. Dibuat dengan HTML &amp; CSS.
</footer>

</body>
</html>
